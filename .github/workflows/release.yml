name: Release APK

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: '发布渠道：源码版本或每日 nightly'
        required: true
        default: version
        type: choice
        options: [version, nightly]

permissions:
  contents: write

concurrency:
  group: apk-publication-${{ github.repository }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  PNPM_VERSION: '10.28.0'
  FLUTTER_VERSION: '3.47.2'
  ANDROID_BUILD_TOOLS_VERSION: '36.0.0'
  ANDROID_PLATFORM_VERSION: '37.0'
  ANDROID_CMAKE_VERSION: '3.22.1'
  NDK_VERSION: '28.2.13676358'
  ALLOWED_THIRD_PARTY_WRAPPER_SHA: 'ee3739525a995bcb5601621a6e2daec1f183bbefc375743acc235cec33547e04'

jobs:
  build:
    if: github.repository == 'ZipperCode/OmniBot'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ORG_GRADLE_PROJECT_OMNI_NDK_VERSION: '28.2.13676358'
      OOB_BUNDLE_LLMTHU_PROVIDER: '0'

    steps:
      - name: 检查发布分支
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main || "$DEFAULT_BRANCH" != main ]]; then
            echo '签名发布只允许默认 main 分支' >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: webchat/pnpm-lock.yaml

      - name: 计算唯一发布计划
        id: publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
          PUBLICATION_CHANNEL: ${{ github.event_name == 'schedule' && 'nightly' || inputs.channel || 'version' }}
        run: |
          node scripts/automatic-apk-release.mjs prepare \
            --channel "$PUBLICATION_CHANNEL" \
            --output "$RUNNER_TEMP/apk-publication-plan.json"

      - name: Set up JDK 21
        if: steps.publication.outputs.publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Validate Gradle wrappers
        if: steps.publication.outputs.publish == 'true'
        uses: gradle/actions/wrapper-validation@v4
        with:
          allow-checksums: ${{ env.ALLOWED_THIRD_PARTY_WRAPPER_SHA }}

      - name: Set up Gradle
        if: steps.publication.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Set up Flutter
        if: steps.publication.outputs.publish == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Android SDK
        if: steps.publication.outputs.publish == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Cache Android SDK release packages
        if: steps.publication.outputs.publish == 'true'
        id: cache-android-sdk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-${{ env.ANDROID_PLATFORM_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/${{ env.ANDROID_BUILD_TOOLS_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/cmake/${{ env.ANDROID_CMAKE_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/licenses
          key: ${{ runner.os }}-android-release-sdk-${{ env.NDK_VERSION }}-${{ env.ANDROID_PLATFORM_VERSION }}-${{ env.ANDROID_BUILD_TOOLS_VERSION }}-${{ env.ANDROID_CMAKE_VERSION }}

      - name: Ensure required Android SDK components
        if: steps.publication.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          license_status=$?
          set -o pipefail
          if [[ "$license_status" -ne 0 ]]; then
            echo 'Android SDK 许可确认失败' >&2
            exit "$license_status"
          fi
          declare -a MISSING_PACKAGES=()
          for package in "ndk;$NDK_VERSION" "platforms;android-$ANDROID_PLATFORM_VERSION" "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "cmake;$ANDROID_CMAKE_VERSION"; do
            if [[ ! -d "$ANDROID_SDK_ROOT/${package/;/\/}" ]]; then
              MISSING_PACKAGES+=("$package")
            fi
          done
          if (( ${#MISSING_PACKAGES[@]} > 0 )); then
            sdkmanager "${MISSING_PACKAGES[@]}"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: 验证发布策略与源码打包
        if: steps.publication.outputs.publish == 'true'
        run: |
          node --test scripts/automatic-apk-release.test.mjs
          node --test scripts/source-packaging.test.mjs

      - name: Install Flutter dependencies
        if: steps.publication.outputs.publish == 'true'
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Flutter test
        if: steps.publication.outputs.publish == 'true'
        working-directory: ui
        run: flutter test

      - name: Gradle unit tests and lint
        if: steps.publication.outputs.publish == 'true'
        run: >-
          ./gradlew --no-daemon --parallel --build-cache --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED"
          :app:testDevelopStandardDebugUnitTest :app:lintDevelopStandardDebug
          -Ptarget=lib/main_standard.dart

      - name: Decode release keystore
        if: steps.publication.outputs.publish == 'true'
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_KEYSTORE_B64" || -z "$RELEASE_PASSWORD" || -z "$RELEASE_KEY_ALIAS" || ! "$RELEASE_CERT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo '签名 Secrets 或证书变量缺失' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.p12"

      - name: Build verified production release APK
        if: steps.publication.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.publication.outputs.tag }}
          OMNI_VERSION_NAME: ${{ steps.publication.outputs.version_name }}
          OMNI_VERSION_CODE: ${{ steps.publication.outputs.version_code }}
          OMNI_DISABLE_APP_UPDATES: '1'
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
          OMNI_RELEASE_STORE_FILE: ${{ runner.temp }}/release.p12
          OMNI_RELEASE_STORE_PWD: ${{ secrets.RELEASE_PASSWORD }}
          OMNI_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          OMNI_RELEASE_KEY_PWD: ${{ secrets.RELEASE_PASSWORD }}
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
        run: |
          bash scripts/build-local-release.sh --edition standard --tag "$RELEASE_TAG" \
            --out-dir "$RUNNER_TEMP/release-artifacts" --non-interactive

      - name: Preserve verified APK artifacts
        if: steps.publication.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ steps.publication.outputs.tag }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/release-artifacts/*.apk
            ${{ runner.temp }}/release-artifacts/*.sha256
            ${{ runner.temp }}/release-artifacts/manifest.txt

      - name: 验证 draft 资产并公开 Release
        if: steps.publication.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          node scripts/automatic-apk-release.mjs publish \
            --plan "$RUNNER_TEMP/apk-publication-plan.json" \
            --artifacts "$RUNNER_TEMP/release-artifacts"

      - name: 清理临时签名
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
